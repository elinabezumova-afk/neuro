<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Программа домашних занятий — Игнат</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F7F6F3;
    color: #2C3E50;
    line-height: 1.5;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .screen { display: none; }
  .screen.active { display: block; }
  .logo { font-size: 13px; color: #888; margin-bottom: 28px; letter-spacing: 0.04em; }

  .login-card {
    background: #fff; border: 1px solid #E5E3DC; border-radius: 14px;
    padding: 28px 24px; max-width: 380px; margin: 40px auto 0;
  }
  .login-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
  input[type=text], input[type=number], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #DDD; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: #2C3E50;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus { outline: none; border-color: #4A9B8E; }
  .login-card input { margin-bottom: 12px; }
  .error-msg { font-size: 12px; color: #C0392B; margin: -4px 0 10px; min-height: 16px; }

  .btn-primary {
    display: inline-block; width: 100%; padding: 11px 16px;
    background: #1D9E75; color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primary:hover { background: #178463; }
  .btn-sm {
    padding: 9px 18px; background: #1D9E75; color: #fff; border: none;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-sm:hover { background: #178463; }
  .btn-secondary {
    padding: 8px 16px; background: transparent; color: #2C3E50;
    border: 1px solid #DDD; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .btn-secondary:hover { background: #F0EEE8; }

  .greeting { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 22px; }

  .week-progress { display: flex; gap: 8px; margin-bottom: 26px; }
  .day-dot { flex: 1; height: 6px; border-radius: 3px; background: #E5E3DC; transition: background .3s; }
  .day-dot.done { background: #1D9E75; }
  .day-dot.current { background: #5DCAA5; }

  .session-card {
    background: #fff; border: 1px solid #E5E3DC; border-radius: 14px;
    margin-bottom: 14px; overflow: hidden;
  }
  .session-header {
    padding: 16px 18px; display: flex; align-items: center;
    justify-content: space-between; cursor: pointer;
  }
  .session-header:hover { background: #FAFAF7; }
  .session-title { font-size: 15px; font-weight: 600; }
  .session-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .session-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; white-space: nowrap; font-weight: 600; }
  .badge-locked { background: #F0EEE8; color: #999; }
  .badge-open { background: #E1F5EE; color: #0F6E56; }
  .badge-done { background: #EAF3DE; color: #3B6D11; }
  .session-body { padding: 0 18px 20px; border-top: 1px solid #EEEDE7; display: none; }
  .session-body.open { display: block; }

  .req-box {
    background: #F0EEE8; border-radius: 8px; padding: 10px 14px;
    font-size: 12.5px; color: #666; margin: 16px 0;
  }

  .scale-legend {
    background: #EFF6F4; border-radius: 8px; padding: 12px 14px;
    margin: 14px 0 18px; font-size: 12px; color: #555; line-height: 1.7;
  }
  .scale-legend strong { color: #2C3E50; font-weight: 600; }

  .exercise { padding: 16px 0; border-bottom: 1px solid #EEEDE7; }
  .exercise:last-of-type { border-bottom: none; }
  .ex-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .ex-time { font-size: 11px; color: #AAA; margin-bottom: 8px; }
  .ex-desc { font-size: 13.5px; color: #555; line-height: 1.6; white-space: pre-line; }

  .stimulus { margin-top: 14px; }
  .stimulus img { width: 100%; border-radius: 8px; border: 1px solid #EEEDE7; display: block; }

  .pic-row-wrap { margin-bottom: 26px; position: relative; padding-bottom: 6px; }
  .pic-row-wrap:last-child { margin-bottom: 4px; }
  .pic-row-label { font-size: 12.5px; color: #888; margin-bottom: 8px; font-weight: 600; }
  .pic-grid-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  .pic-cell-6 { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .pic-cell-6 img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; border: 1px solid #EEEDE7; background: #fff; display: block; }
  .pic-cell-6 .pill { width: 100%; text-align: center; }
  .pic-fb { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .pic-fb.ok { color: #1D9E75; font-weight: 600; }
  .pic-fb.no { color: #C0392B; }

  .ex-feedback { margin-top: 12px; }
  .ex-feedback-label { font-size: 11.5px; color: #999; margin-bottom: 6px; }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    padding: 5px 12px; border-radius: 20px; font-size: 12.5px;
    border: 1px solid #DDD; background: #fff; color: #777;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .pill:hover { border-color: #4A9B8E; }
  .pill.sel-easy { background: #E1F5EE; border-color: #1D9E75; color: #0F6E56; font-weight: 600; }
  .pill.sel-ok { background: #FAEEDA; border-color: #BA7517; color: #633806; font-weight: 600; }
  .pill.sel-hard { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; font-weight: 600; }

  .feedback-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid #EEEDE7; }
  .feedback-label { font-size: 12.5px; color: #666; margin-bottom: 8px; }
  .time-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .time-row label { font-size: 12.5px; color: #666; white-space: nowrap; }
  .time-row input { width: 70px; }
  .comment-area { width: 100%; min-height: 70px; resize: vertical; font-size: 13.5px; }
  .submit-row { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .submit-msg { font-size: 12.5px; color: #0F6E56; font-weight: 600; display: none; }
  .submit-msg.visible { display: block; }
  .sending-msg { font-size: 12.5px; color: #888; display: none; }
  .sending-msg.visible { display: block; }
  .locked-msg { padding: 16px 18px; font-size: 13px; color: #AAA; font-style: italic; }
  .logout-row { margin-top: 28px; text-align: center; }

  .pic-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 8px; }
  .sample-only-wrap { width: calc(50% - 4px); margin: 0 auto 12px; }
  .sample-only-wrap img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; border: none; background: #fff; display: block; }
  .sample-only-label { font-size: 12.5px; color: #888; margin-bottom: 6px; font-weight: 600; text-align: center; }

  @media (min-width: 480px) {
    .pic-grid-6 { grid-template-columns: repeat(6, 1fr); }
    .pic-grid-4 { grid-template-columns: repeat(4, 1fr); }
    .sample-only-wrap { width: calc(25% - 6px); }
  }
</style>
</head>
<body>
<div class="wrap">

<div class="logo">Программа домашних занятий</div>

<div id="screen-login" class="screen active">
  <div class="login-card">
    <h2>Добро пожаловать</h2>
    <p>Введите код, который вам прислал специалист</p>
    <input type="text" id="code-input" placeholder="Ваш код" autocomplete="off" />
    <div class="error-msg" id="login-error"></div>
    <button class="btn-primary" onclick="doLogin()">Войти</button>
  </div>
</div>

<div id="screen-main" class="screen">
  <div class="greeting" id="greeting">Привет!</div>
  <div class="sub">5 занятий</div>
  <div class="week-progress">
    <div class="day-dot" id="dot-0"></div>
    <div class="day-dot" id="dot-1"></div>
    <div class="day-dot" id="dot-2"></div>
    <div class="day-dot" id="dot-3"></div>
    <div class="day-dot" id="dot-4"></div>
  </div>
  <div id="sessions-list"></div>
  <div class="logout-row"><button class="btn-secondary" onclick="doLogout()">Выйти</button></div>
</div>

</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwUlqOVl9Jqzz4HnvnPjEbZi4oUwchWTdnEMGhu6ELbjlZy1jmwFvSFN2AGgMp06uNGqw/exec';

const CODES = { 'ИГНАТ': 'Игнат', 'DEMO': 'Демо' };
const SESSIONS = [{"title": "Занятие 1", "req": "Понадобятся: массажный мячик, небольшой мяч для подбрасывания, таймер (например, секундомер на телефоне)", "exercises": [{"name": "Миофасциальный релиз", "time": "3 мин", "desc": "Ребёнок считает сам — количество прокатываний на каждой стопе и на каждой поверхности руки. Взрослый рядом, но не считает вслух. Если ребёнок спешит — мягко замедляем: «Не торопись, полное движение до конца».\n\nПрокатываем мячиком стопы вдоль — от пальчиков до пятки и обратно, с лёгким нажимом. 7–10 повторов на каждой стопе.\n\nПрокатываем мячиком каждую руку от кончиков пальцев до локтя, 5 раз туда и обратно. Затем разворачиваем руку ладонью вверх и прокатываем тыльную сторону, затем боковую (рука ребром на мячике)."}, {"name": "Дыхание", "time": "3-4 мин", "desc": "Исходное положение — лежим на спине, ноги согнуты в коленях, руки вдоль тела прямые, ладони в пол.\n\nДва цикла простого дыхания: по команде «вдох» плавно вдох носом, по команде «выдох» — выдох через рот (долгий и шумный).\n\nДва цикла с движением правой рукой: на вдохе плавно поднимаем прямую правую руку вверх, перпендикулярно полу — рука полностью прямая, вытянутая как струнка до кончиков пальцев, — на выдохе так же плавно опускаем.\n\nДва цикла левой рукой — так же, рука полностью прямая, вытянутая как струнка до кончиков пальцев.\n\nДва цикла обеими руками одновременно: на вдохе поднимаем обе прямые руки вверх, каждая вытянута как струнка до кончиков пальцев, на выдохе опускаем.\n\nВсе движения плавные, без рывков. Если ребёнок отвлекается — мягко останавливаемся, просим принять исходное положение и начинаем заново."}, {"name": "Мяч — подбрасывание и слежение глазами", "time": "4 мин", "desc": "Ребёнок подбрасывает мяч вверх (двумя руками или одной — как удобнее) и ловит его, не отрывая взгляд от мяча: голова и глаза следят за мячом от броска до ловли, не поворачиваясь в сторону.\n\nДаём три попытки подряд. В каждой попытке считаем, сколько раз подряд ребёнок поймал мяч без ошибки — уронил мяч или отвёл взгляд в сторону, серия прерывается, начинаем считать заново с начала этой попытки.\n\nЛучший результат из трёх попыток записываем как рекорд занятия — в следующий раз попробуем его побить."}, {"name": "Зрительное внимание — найди одинаковые картинки", "time": "4–5 мин", "desc": "Четыре задания подряд. В каждом наборе шесть похожих картинок — нужно найти среди них две одинаковые и нажать на обе.", "stimulus": "zritelnoe_c3_l1"}, {"name": "Ритмы", "time": "7 мин", "desc": "Усложнённый вариант — переключение по команде. Базовый ритм остаётся прежним: раз (сильный хлопок двумя руками) — и (слабый хлопок) — два — и — три — и — четыре — и. Хлопки делаем на коленях или по столу.\n\nВзрослый в процессе называет одну из трёх команд: «обе», «правая» или «левая» — и ребёнок сразу же, без остановки, переключается: по команде «обе» слабый хлопок на «и» делается двумя руками, по команде «правая» — только правой рукой, по команде «левая» — только левой. Сильные хлопки (раз-два-три-четыре) всегда двумя руками. Команды даются в произвольном порядке. Вслух считать не обязательно — можно, если ребёнку так легче.\n\nНачинаем с заметного интервала — даём ребёнку отхлопать одну четвёрку под одной командой, прежде чем назвать следующую. Если переключения проходят без ошибок — делаем команды менее предсказуемыми: меняем интервал между ними (не всегда ровно одна четвёрка) и порядок команд — вразнобой."}, {"name": "Слуховое внимание", "time": "3 мин", "desc": "Найди общий звук (если сложно на слух определить — обязательно проговаривать вслух). Взрослый называет два слова, ребёнок определяет, какой звук есть в обоих. Произносим слова нараспев и просим так же повторить.\n\n1. Дом — кот\n2. Сад — бак\n3. Куст — дуб\n4. Сон — конь\n5. Шаг — мрак\n6. Груз — бук"}]}, {"title": "Занятие 2", "req": "Понадобятся: массажный мячик, небольшой мяч для подбрасывания, таймер (например, секундомер на телефоне)", "exercises": [{"name": "Миофасциальный релиз", "time": "3 мин", "desc": "Ребёнок считает сам — количество прокатываний на каждой стопе и на каждой поверхности руки. Взрослый рядом, но не считает вслух. Если ребёнок спешит — мягко замедляем: «Не торопись, полное движение до конца».\n\nПрокатываем мячиком стопы вдоль — от пальчиков до пятки и обратно, с лёгким нажимом. 7–10 повторов на каждой стопе.\n\nПрокатываем мячиком каждую руку от кончиков пальцев до локтя, 5 раз туда и обратно. Затем разворачиваем руку ладонью вверх и прокатываем тыльную сторону, затем боковую (рука ребром на мячике)."}, {"name": "Дыхание", "time": "3-4 мин", "desc": "Исходное положение — лежим на спине, ноги согнуты в коленях, руки вдоль тела прямые, ладони в пол.\n\nДва цикла простого дыхания: по команде «вдох» плавно вдох носом, по команде «выдох» — выдох через рот (долгий и шумный).\n\nДва цикла с движением правой рукой: на вдохе плавно поднимаем прямую правую руку вверх, перпендикулярно полу — рука полностью прямая, вытянутая как струнка до кончиков пальцев, — на выдохе так же плавно опускаем.\n\nДва цикла левой рукой — так же, рука полностью прямая, вытянутая как струнка до кончиков пальцев.\n\nДва цикла обеими руками одновременно: на вдохе поднимаем обе прямые руки вверх, каждая вытянута как струнка до кончиков пальцев, на выдохе опускаем.\n\nВсе движения плавные, без рывков. Если ребёнок отвлекается — мягко останавливаемся, просим принять исходное положение и начинаем заново."}, {"name": "Мяч — подбрасывание и слежение глазами", "time": "4 мин", "desc": "Ребёнок подбрасывает мяч вверх (двумя руками или одной — как удобнее) и ловит его, не отрывая взгляд от мяча: голова и глаза следят за мячом от броска до ловли, не поворачиваясь в сторону.\n\nЕсли видно, что ребёнок не следит глазами за мячом (смотрит в одну точку, отводит взгляд, поворачивает голову) — останавливаем попытку сразу и начинаем считать заново с начала этой попытки. Считаем только те броски, где было настоящее слежение глазами.\n\nЦель — 20 бросков подряд без ошибки. Даётся не более 3 попыток. Если получилось с первой попытки — упражнение считается выполненным. Обязательно похвалить ребёнка за старание, независимо от результата."}, {"name": "Зрительное внимание — найди отличия", "time": "4–5 мин", "desc": "Перед ребёнком — две похожие картинки. Нужно внимательно сравнить их между собой и найти все отличия.\n\nСначала рассматриваем одну картинку и называем основные детали, затем ищем на второй картинке то, что изменилось.", "stimulus": "zritelnoe_c3_l2"}, {"name": "Ритмы", "time": "7 мин", "desc": "Усложнённый вариант — переключение по команде. Базовый ритм остаётся прежним: раз (сильный хлопок двумя руками) — и (слабый хлопок) — два — и — три — и — четыре — и. Хлопки делаем на коленях или по столу.\n\nВзрослый в процессе называет одну из трёх команд: «обе», «правая» или «левая» — и ребёнок сразу же, без остановки, переключается: по команде «обе» слабый хлопок на «и» делается двумя руками, по команде «правая» — только правой рукой, по команде «левая» — только левой. Сильные хлопки (раз-два-три-четыре) всегда двумя руками. Команды даются в произвольном порядке. Вслух считать не обязательно — можно, если ребёнку так легче.\n\nНачинаем с заметного интервала — даём ребёнку отхлопать одну четвёрку под одной командой, прежде чем назвать следующую. Если переключения проходят без ошибок — делаем команды менее предсказуемыми: меняем интервал между ними (не всегда ровно одна четвёрка) и порядок команд — вразнобой.\n\nЦель — продержаться без ошибок 40 секунд. Даётся не более 3 попыток. Если получилось с первой попытки — упражнение на этом считается выполненным. Обязательно хвалить ребёнка за старание, независимо от результата."}, {"name": "Слуховое внимание", "time": "3 мин", "desc": "Поймай то, что НЕ бывает зелёного цвета (хлопнуть в ладоши при назывании слова взрослым). Скорость перечисления слов такая, чтобы ребёнку нужно было бы немного поторопиться, но он может справиться (даже если с некоторыми ошибками).\n\nСписок слов: крокодил, каша, банан, машина, ime": "3 мин", "desc": "Слушай внимательно и найди ошибку, если она есть. Повтори фразу правильно (исправив ошибку или повторив её полностью, если ошибок нет).\n\nСписок фраз:\n1. На коньках катаются по снегу.\n2. После дождя на небе образуются лужи.\n3. Как вкусно намазать хлеб маслом и положить сверху кусочек сыра.\n4. Зимой на ёлке растут шишки, а летом — яблоки.\n5. Рано утром, сразу после ужина, дети собираются в школу.\n6. Когда клубника созревает, ягода становится красной.\n7. Кошки летают быстрее собак."}]}, {"title": "Занятие 4", "req": "Понадобятся: массажный мячик, небольшой мяч для подбрасывания, таймер (например, секундомер на телефоне)", "exercises": [{"name": "Миофасциальный релиз", "time": "3 мин", "desc": "Ребёнок считает сам — количество прокатываний на каждой стопе и на каждой поверхности руки. Взрослый рядом, но не считает вслух. Если ребёнок спешит — мягко замедляем: «Не торопись, полное движение до конца».\n\nПрокатываем мячиком стопы вдоль — от пальчиков до пятки и обратно, с лёгким нажимом. 7–10 повторов на каждой стопе.\n\nПрокатываем мячиком каждую руку от кончиков пальцев до локтя, 5 раз туда и обратно. Затем разворачиваем руку ладонью вверх и прокатываем тыльную сторону, затем боковую (рука ребром на мячике)."}, {"name": "Дыхание", "time": "3-4 мин", "desc": "Исходное положение — лежим на спине, ноги согнуты в коленях, руки вдоль тела прямые, ладони в пол.\n\nДва цикла простого дыхания: по команде «вдох» плавно вдох носом, по команде «выдох» — выдох через рот (долгий и шумный).\n\nДва цикла с движением правой рукой: на вдохе плавно поднимаем прямую правую руку вверх, перпендикулярно полу — рука полностью прямая, вытянутая как струнка до кончиков пальцев, — на выдохе так же плавно опускаем.\n\nДва цикла левой рукой — так же, рука полностью прямая, вытянутая как струнка до кончиков пальцев.\n\nДва цикла обеими руками одновременно: на вдохе поднимаем обе прямые руки вверх, каждая вытянута как струнка до кончиков пальцев, на выдохе опускаем.\n\nВсе движения плавные, без рывков. Если ребёнок отвлекается — мягко останавливаемся, просим принять исходное положение и начинаем заново."}, {"name": "Слежение за предметом на расстоянии вытянутой руки", "time": "3–4 мин", "desc": "Взрослый держит небольшой яркий предмет (карандаш, игрушка на палочке или кончик пальца) на расстоянии вытянутой руки от лица ребёнка. Голова ребёнка неподвижна, следят только глаза. Взрослый медленно двигает предметом: сначала по горизонтали (влево-вправо), затем по вертикали (вверх-вниз), затем по кругу, а затем по произвольной траектории — так же плавно, не быстро — несколько медленных проходов в каждом направлении.\n\nЕсли ребёнок начинает поворачивать голову вслед за предметом вместо того, чтобы вести его взглядом — останавливаем, напоминаем «голова не двигается, следят только глаза» и повторяем это направление заново."}, {"name": "Зрительное внимание — найди картинку по образцу", "time": "4–5 мин", "desc": "Четыре задания подряд. В каждом — картинка-образец и несколько похожих вариантов, нужно найти среди них точно такой же, как образец.\n\nПроговорите с ребёнком стратегию поиска — выбери 1-2 самые заметные или простые детали на картинке-образце, и сравни по этим деталям каждую картинку последовательно.", "stimulus": "zritelnoe_c3_l4"}, {"name": "Ритмы", "time": "7 мин", "desc": "Усложнённый вариант — переключение по команде. Базовый ритм остаётся прежним: раз (сильный хлопок двумя руками) — и (слабый хлопок) — два — и — три — и — четыре — и. Хлопки делаем на коленях или по столу.\n\nВзрослый в процессе называет одну из трёх команд: «обе», «правая» или «левая» — и ребёнок сразу же, без остановки, переключается: по команде «обе» слабый хлопок на «и» делается двумя руками, по команде «правая» — только правой рукой, по команде «левая» — только левой. Сильные хлопки (раз-два-три-четыре) всегда двумя руками. Команды даются в произвольном порядке. Вслух считать не обязательно — можно, если ребёнку так легче.\n\nНачинаем с заметного интервала — даём ребёнку отхлопать одну четвёрку под одной командой, прежде чем назвать следующую. Если переключения проходят без ошибок — делаем команды менее предсказуемыми: меняем интервал между ними (не всегда ровно одна четвёрка) и порядок команд — вразнобой.\n\nЦель — продержаться без ошибок 40 секунд. Даётся не более 3 попыток. Если получилось с первой попытки — упражнение на этом считается выполненным. Обязательно хвалить ребёнка за старание, независимо от результата."}, {"name": "Слуховое внимание", "time": "3 мин", "desc": "Поймай то, что НЕ бывает горячим (хлопнуть в ладоши при назывании слова взрослым). Скорость перечисления слов такая, чтобы ребёнку нужно было бы немного поторопиться, но он может справиться (даже если с некоторыми ошибками).\n\nСписок слов: суп, огонь, вода, еда, мороженое, чай, дождь, плита, книга, каша, шоколад, воздух, камин, карандаш, варежки, двигатель, пирог, снег, руки, горка."}]}, {"title": "Занятие 5", "req": "Понадобятся: массажный мячик, небольшой мяч для подбрасывания, таймер (например, секундомер на телефоне)", "exercises": [{"name": "Миофасциальный релиз", "time": "3 мин", "desc": "Ребёнок считает сам — количество прокатываний на каждой стопе и на каждой поверхности руки. Взрослый рядом, но не считает вслух. Если ребёнок спешит — мягко замедляем: «Не торопись, полное движение до конца».\n\nПрокатываем мячиком стопы вдоль — от пальчиков до пятки и обратно, с лёгким нажимом. 7–10 повторов на каждой стопе.\n\nПрокатываем мячиком каждую руку от кончиков пальцев до локтя, 5 раз туда и обратно. Затем разворачиваем руку ладонью вверх и прокатываем тыльную сторону, затем боковую (рука ребром на мячике)."}, {"name": "Дыхание", "time": "3-4 мин", "desc": "Исходное положение — стоя, руки прямые опущены вниз. С плавным вдохом поднимаем руки вверх. Руки полностью прямые, как струнки. Задерживаемся с поднятыми вверх руками на 2 секунды не дыша (задерживаем дыхание) и тянем их к потолку сильно-сильно (чувствуются мышцы спины). Затем с плавным выдохом (через рот) опускаем руки вниз по той же траектории.\n\nВажно:\n— сначала покажите упражнение ребёнку на себе\n— вдох всегда через нос, выдох — через рот\n— вдох должен быть короче, чем выдох (например, вдох на 3 секунды, выдох — 4 секунды. Если удобнее — можно считать вслух)."}, {"name": "Слежение за предметом на расстоянии вытянутой руки", "time": "3–4 мин", "desc": "Взрослый держит небольшой яркий предмет (карандаш, игрушка на палочке или кончик пальца) на расстоянии вытянутой руки от лица ребёнка. Голова ребёнка неподвижна, следят только глаза. Взрослый медленно двигает предметом: сначала по горизонтали (влево-вправо), затем по вертикали (вверх-вниз), затем по кругу, а затем по произвольной траектории — так же плавно, не быстро — несколько медленных проходов в каждом направлении.\n\nЕсли ребёнок начинает поворачивать голову вслед за предметом вместо того, чтобы вести его взглядом — останавливаем, напоминаем «голова не двигается, следят только глаза» и повторяем это направление заново."}, {"name": "Зрительное внимание — найди картинку по образцу", "time": "4–5 мин", "desc": "Четыре задания подряд. В каждом — картинка-образец и несколько похожих вариантов, нужно найти среди них точно такой же, как образец.\n\nПроговорите с ребёнком стратегию поиска — выбери 1-2 самые заметные или простые детали на картинке-образце, и сравни по этим деталям каждую картинку последовательно.", "stimulus": "zritelnoe_c3_l5"}, {"name": "Ритмы", "time": "7 мин", "desc": "Усложнённый вариант — переключение по команде. Базовый ритм остаётся прежним: раз (сильный хлопок двумя руками) — и (слабый хлопок) — два — и — три — и — четыре — и. Хлопки делаем на коленях или по столу.\n\nВзрослый в процессе называет одну из трёх команд: «обе», «правая» или «левая» — и ребёнок сразу же, без остановки, переключается: по команде «обе» слабый хлопок на «и» делается двумя руками, по команде «правая» — только правой рукой, по команде «левая» — только левой. Сильные хлопки (раз-два-три-четыре) вс const IMAGE_STIMULI = {};
const PIC_SETS = { zritelnoe: ZRITELNOE_TASKS, zritelnoe_l2: ZRITELNOE_L2_TASKS, zritelnoe_l3: ZRITELNOE_L3_TASKS, zritelnoe_l4: ZRITELNOE_L4_TASKS, zritelnoe_l5: ZRITELNOE_L5_TASKS, zritelnoe_c3_l1: ZRITELNOE_C3_L1_TASKS };
const DIFF_SETS = { zritelnoe_c3_l2: ZRITELNOE_C3_L2_DIFF, zritelnoe_c3_l3: ZRITELNOE_C3_L3_DIFF };
const SAMPLE_SETS = { zritelnoe_c3_l4: ZRITELNOE_C3_L4_SAMPLE, zritelnoe_c3_l5: ZRITELNOE_C3_L5_SAMPLE };

let currentUser = null;
let progress = {};

function loadProgress(code) {
  const raw = localStorage.getItem('neuro_ignat_v5_' + code);
  return raw ? JSON.parse(raw) : { completed: [], feedback: {} };
}
function saveProgress() {
  localStorage.setItem('neuro_ignat_v5_' + currentUser, JSON.stringify(progress));
}

function doLogin() {
  const val = document.getElementById('code-input').value.trim().toUpperCase();
  const err = document.getElementById('login-error');
  if (!CODES[val]) { err.textContent = 'Код не найден. Проверьте и попробуйте снова.'; return; }
  err.textContent = '';
  currentUser = val;
  progress = loadProgress(val);
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  document.getElementById('greeting').textContent = 'Привет, ' + CODES[val] + '!';
  renderSessions();
}
function doLogout() {
  currentUser = null;
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('code-input').value = '';
}

function renderSessions() {
  updateDots();
  const list = document.getElementById('sessions-list');
  list.innerHTML = '';
  SESSIONS.forEach((s, i) => {
    const isDone = progress.completed.includes(i);
    const isOpen = i === 0 || progress.completed.includes(i - 1);
    const badge = isDone ? '<span class="session-badge badge-done">Выполнено</span>'
      : isOpen ? '<span class="session-badge badge-open">Доступно</span>'
      : '<span class="session-badge badge-locked">Заблокировано</span>';
    const card = document.createElement('div');
    card.className = 'session-card';
    card.innerHTML = `
      <div class="session-header" onclick="toggleSession(${i})">
        <div><div class="session-title">${s.title}</div></div>
        ${badge}
      </div>
      <div class="session-body" id="body-${i}">
        ${isOpen ? buildBody(i, s, isDone) : '<div class="locked-msg">Доступно после выполнения предыдущего занятия</div>'}
      </div>`;
    list.appendChild(card);
  });
}

function buildBody(idx, s, isDone) {
  const fb = progress.feedback[idx] || {};
  const legend = `<div class="scale-legend">
    <strong>Как оценивать выполнение:</strong><br>
    <strong>Легко</strong> — справился с первого раза, без помощи и быстро<br>
    <strong>Нормально</strong> — потребовалась небольшая помощь, были незначительные ошибки или неточности<br>
    <strong>Трудно</strong> — для выполнения требовалась развёрнутая помощь взрослого
  </div>`;

  const exHTML = s.exercises.map((ex, ei) => {
    const exFb = (fb.exercises || {})[ei] || {};
    const pills = ['легко','нормально','трудно'].map(d => {
      const sel = exFb.diff === d ? (d==='легко'?'sel-easy':d==='нормально'?'sel-ok':'sel-hard') : '';
      return `<button class="pill ${sel}" onclick="setExPill(${idx},${ei},'${d}',this)">${d}</button>`;
    }).join('');
    const stim = ex.stimulus ? `<div class="stimulus">${buildStimulus(idx, ei, ex.stimulus)}</div>` : '';
    return `<div class="exercise">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-time">${ex.time}</div>
      <div class="ex-desc">${ex.desc}</div>
      ${stim}
      <div class="ex-feedback">
        <div class="ex-feedback-label">Как прошло это упражнение?</div>
        <div class="pill-group" id="expills-${idx}-${ei}">${pills}</div>
      </div>
    </div>`;
  }).join('');

  return `
    ${s.req ? `<div class="req-box">${s.req}</div>` : ''}
    ${legend}
    ${exHTML}
    <div class="feedback-section">
      <div class="time-row">
        <label class="feedback-label" style="margin:0">Сколько минут заняло:</label>
        <input type="number" min="1" max="60" placeholder="15" value="${fb.time||''}" oninput="setField(${idx},'time',this.value)">
      </div>
      <div class="feedback-label">С какими трудностями столкнулись?</div>
      <textarea class="comment-area" placeholder="Необязательно..." oninput="setField(${idx},'comment',this.value)">${fb.comment||''}</textarea>
      <div class="submit-row">
        <button class="btn-sm" onclick="submitSession(${idx})">Сохранить и завершить занятие</button>
        <span class="sending-msg" id="sending-${idx}">Отправляем...</span>
        <span class="submit-msg ${isDone?'visible':''}" id="msg-${idx}">Сохранено!</span>
      </div>
    </div>`;
}

function buildStimulus(idx, ei, type) {
  if (IMAGE_STIMULI[type]) {
    return '<img src="' + IMAGE_STIMULI[type] + '" alt="Стимул"/>';
  }
  if (PIC_SETS[type]) {
    const letters = ['А','Б','В','Г','Д','Е'];
    const tasks = PIC_SETS[type];
    window.__matchAnswers = window.__matchAnswers || {};
    window.__matchAnswers[idx + '-' + ei] = tasks.map(t => t.answer);
    return tasks.map((task, ti) => {
      const cells = task.items.map((img, ci) => {
        const letter = letters[ci];
        return '<div class="pic-cell-6"><img src="' + img + '" alt="' + letter + '"/><button class="pill" id="matchbtn-' + idx + '-' + ei + '-' + ti + '-' + letter + '" onclick="handleMatchClick(' + idx + ',' + ei + ',' + ti + ',\'' + letter + '\',this)">' + letter + '</button></div>';
      }).join('');
      return '<div class="pic-row-wrap"><div class="pic-row-label">Задание ' + (ti+1) + ' — ' + task.label + '</div><div class="pic-grid-6">' + cells + '</div><div class="pic-fb" id="matchfb-' + idx + '-' + ei + '-' + ti + '"></div></div>';
    }).join('');
  }
  if (SAMPLE_SETS[type]) {
    const letters = ['А','Б','В','Г'];
    const tasks = SAMPLE_SETS[type];
    window.__sampleAnswers = window.__sampleAnswers || {};
    window.__sampleAnswers[idx + '-' + ei] = tasks.map(t => t.answer);
    return tasks.map((task, ti) => {
      const cells = task.items.map((img, ci) => {
        const letter = letters[ci];
        return '<div class="pic-cell-6"><img src="' + img + '" alt="' + letter + '"/><button class="pill" id="samplebtn-' + idx + '-' + ei + '-' + ti + '-' + letter + '" onclick="handleSampleClick(' + idx + ',' + ei + ',' + ti + ',\'' + letter + '\',this)">' + letter + '</button></div>';
      }).join('');
      return '<div class="pic-row-wrap"><div class="pic-row-label">Задание ' + (ti+1) + ' — ' + task.label + '</div><div class="sample-only-wrap"><div class="sample-only-label">Образец</div><img src="' + task.sample + '" alt="Образец"/></div><div class="pic-grid-4">' + cells + '</div><div class="pic-fb" id="samplefb-' + idx + '-' + ei + '-' + ti + '"></div></div>';
    }).join('');
  }
  if (DIFF_SETS[type]) {
    const d = DIFF_SETS[type];
    return '<div class="pic-row-wrap"><div class="pic-row-label">' + d.label + ' — найдите все отличия (их ' + d.count + ')</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;"><img src="' + d.imgA + '" alt="Картинка А" style="max-width:280px;border:1px solid #ccc;"/><img src="' + d.imgB + '" alt="Картинка Б" style="max-width:280px;border:1px solid #ccc;"/></div></div>';
  }
  return '';
}

function handleSampleClick(idx, ei, ti, letter, el) {
  const key = `sample-${idx}-${ei}-${ti}`;
  if (!progress.feedback[idx]) progress.feedback[idx] = {};
  if (!progress.feedback[idx].samples) progress.feedback[idx].samples = {};
  const state = progress.feedback[idx].samples[key] || { done: false };
  if (state.done) return;
  const answer = window.__sampleAnswers[idx + '-' + ei][ti];
  const fb = document.getElementById(`samplefb-${idx}-${ei}-${ti}`);
  if (letter === answer) {
    state.done = true;
    el.classList.add('sel-easy');
    fb.textContent = 'Правильно!'; fb.className = 'pic-fb ok';
  } else {
    el.classList.add('sel-hard');
    fb.textContent = 'Не совсем — попробуйте ещё раз'; fb.className = 'pic-fb no';
    setTimeout(() => {
      el.classList.remove('sel-hard');
      fb.textContent = ''; fb.className = 'pic-fb';
    }, 900);
  }
  progress.feedback[idx].samples[key] = state;
  saveProgress();
}

function toggleSession(i) {
  document.getElementById('body-' + i).classList.toggle('open');
}

function handleMatchClick(idx, ei, ti, letter, el) {
  const key = `match-${idx}-${ei}-${ti}`;
  if (!progress.feedback[idx]) progress.feedback[idx] = {};
  if (!progress.feedback[idx].matches) progress.feedback[idx].matches = {};
  const state = progress.feedback[idx].matches[key] || { selected: [], done: false };
  if (state.done) return;

  const idxIn = state.selected.indexOf(letter);
  if (idxIn >= 0) {
    state.selected.splice(idxIn, 1);
    el.classList.remove('sel-easy');
    progress.feedback[idx].matches[key] = state;
    saveProgress();
    return;
  }
  state.selected.push(letter);
  el.classList.add('sel-easy');

  if (state.selected.length === 2) {
    const answer = window.__matchAnswers[idx + '-' + ei][ti];
    const fb = document.getElementById(`matchfb-${idx}-${ei}-${ti}`);
    const sortedSel = [...state.selected].sort();
    const sortedAns = [...answer].sort();
    const isCorrect = sortedSel[0] === sortedAns[0] && sortedSel[1] === sortedAns[1];
    const btnA = document.getElementById(`matchbtn-${idx}-${ei}-${ti}-${state.selected[0]}`);
    const btnB = document.getElementById(`matchbtn-${idx}-${ei}-${ti}-${state.selected[1]}`);
    if (isCorrect) {
      state.done = true;
      btnA.classList.add('sel-easy'); btnB.classList.add('sel-easy');
      fb.textContent = 'Правильно!'; fb.className = 'pic-fb ok';
    } else {
      btnA.classList.add('sel-hard'); btnB.classList.add('sel-hard');
      fb.textContent = 'Не совсем — попробуйте ещё раз'; fb.className = 'pic-fb no';
      setTimeout(() => {
        btnA.classList.remove('sel-easy','sel-hard'); btnB.classList.remove('sel-easy','sel-hard');
        fb.textContent = ''; fb.className = 'pic-fb';
        state.selected = [];
        progress.feedback[idx].matches[key] = state;
        saveProgress();
      }, 900);
    }
  }
  progress.feedback[idx].matches[key] = state;
  saveProgress();
}

function setExPill(idx, ei, val, el) {
  if (!progress.feedback[idx]) progress.feedback[idx] = {};
  if (!progress.feedback[idx].exercises) progress.feedback[idx].exercises = {};
  if (!progress.feedback[idx].exercises[ei]) progress.feedback[idx].exercises[ei] = {};
  progress.feedback[idx].exercises[ei].diff = val;
  saveProgress();
  const group = document.getElementById(`expills-${idx}-${ei}`);
  const cls = val==='легко'?'sel-easy':val==='нормально'?'sel-ok':'sel-hard';
  group.querySelectorAll('.pill').forEach(p => p.classList.remove('sel-easy','sel-ok','sel-hard'));
  el.classList.add(cls);
}
function setField(idx, field, val) {
  if (!progress.feedback[idx]) progress.feedback[idx] = {};
  progress.feedback[idx][field] = val;
  saveProgress();
}

async function submitSession(idx) {
  const fb = progress.feedback[idx] || {};
  const s = SESSIONS[idx];

  progress.feedback[idx] = progress.feedback[idx] || {};
  progress.feedback[idx].done = true;

  const missingDiff = [];
  s.exercises.forEach((ex, ei) => {
    const exFb = (fb.exercises || {})[ei] || {};
    if (!exFb.diff) missingDiff.push(ex.name);
  });
  if (missingDiff.length > 0) {
    alert('Пожалуйста, оцените сложность для каждого упражнения:\n\n' + missingDiff.join('\n'));
    return;
  }

  if (!fb.time || String(fb.time).trim() === '') {
    alert('Пожалуйста, укажите сколько минут заняло занятие');
    return;
  }

  const sending = document.getElementById('sending-' + idx);
  sending.classList.add('visible');
  const submitBtn = document.querySelector(`[onclick="submitSession(${idx})"]`);
  if (submitBtn) { submitBtn.disabled = true; submitBtn.style.opacity = '0.5'; }
  const rows = s.exercises.map((ex, ei) => {
    const exFb = (fb.exercises || {})[ei] || {};
    return {
      code: currentUser, name: CODES[currentUser], session: s.title,
      exercise: ex.name, difficulty: exFb.diff || '',
      done: fb.done ? 'да' : 'нет',
      time: ei === 0 ? (fb.time || '') : '',
      comment: ei === 0 ? (fb.comment || '') : ''
    };
  });

  for (const row of rows) {
    try {
      await fetch(SHEETS_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(row) });
      await new Promise(r => setTimeout(r, 350));
    } catch(e) {}
  }

  if (!progress.completed.includes(idx)) progress.completed.push(idx);
  saveProgress();
  sending.classList.remove('visible');
  document.getElementById('msg-' + idx).classList.add('visible');
  setTimeout(() => renderSessions(), 700);
}

function updateDots() {
  SESSIONS.forEach((_, i) => {
    const dot = document.getElementById('dot-' + i);
    dot.className = 'day-dot' + (progress.completed.includes(i) ? ' done' : (i===0||progress.completed.includes(i-1)) ? ' current' : '');
  });
}
</script>
